  <ifx-select
    size="m"
    [placeholder]="true"
    [showClearButton]="true"
    [showSearch]="true"
    search-placeholder-value="Search..."
    label=""
    caption=""
    placeholder-value="Placeholder"
    aria-select-label="Select"
    aria-search-label="Search options"
    aria-clear-label="Clear selection"
    aria-select-labelled-by=""
    aria-select-described-by=""
    [error]="false"
    [disabled]="false"
    [readOnly]="false"
    [required]="false">
    <ifx-select-option
      value="a"
      (ifxInput)="handleInput($any($event))"
      (ifxOpen)="handleOpen($any($event))"
      (ifxSelect)="handleSelect($any($event))">Option A</ifx-select-option>
    <ifx-select-option value="b">Option B</ifx-select-option>
    <ifx-select-option value="c">Option C</ifx-select-option>
    <ifx-select-option
      value="d"
      [disabled]="true">Option D (disabled)</ifx-select-option>
  </ifx-select>

<details class="code-details">
  <summary>View Code</summary>
  <div class="code-blocks">
    <h3>ifx-select-example.ts</h3>
    <pre><code class="language-typescript" [innerHTML]="tsCode"></code></pre>
    
    <h3>ifx-select-example.html</h3>
    <pre><code class="language-markup" [innerHTML]="htmlCode"></code></pre>
  </div>
</details>
