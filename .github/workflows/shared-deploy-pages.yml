name: Deploy Pages

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
        description: 'Deployment mode (preview, production, cleanup)'
    outputs:
      preview-url:
        description: 'Root URL of the deployed PR preview'
        value: ${{ jobs.deploy.outputs.preview-url }}

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ inputs.mode != 'cleanup' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      preview-url: ${{ steps.preview-root.outputs.url || '' }}
    steps:
      - name: Validate deployment mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [[ "$MODE" != "preview" && "$MODE" != "production" ]]; then
            echo "Unsupported deployment mode: $MODE" >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: build-storybook
          path: _deploy/storybook

      - name: Download HTML CDN example artifact
        uses: actions/download-artifact@v4
        with:
          name: build-html-cdn-example
          path: _deploy/html-cdn-example

      - name: Download HTML Vite example artifact
        uses: actions/download-artifact@v4
        with:
          name: build-html-vite-example
          path: _deploy/html-vite-example

      - name: Download Angular module example artifact
        uses: actions/download-artifact@v4
        with:
          name: build-angular-module-example
          path: _deploy/angular-module-example

      - name: Download Angular standalone example artifact
        uses: actions/download-artifact@v4
        with:
          name: build-angular-standalone-example
          path: _deploy/angular-standalone-example

      - name: Download React example artifact
        uses: actions/download-artifact@v4
        with:
          name: build-react-example
          path: _deploy/react-example

      - name: Download Vue example artifact
        uses: actions/download-artifact@v4
        with:
          name: build-vue-example
          path: _deploy/vue-example

      - name: Validate deployment contents
        run: |
          for directory in \
            storybook \
            html-cdn-example \
            html-vite-example \
            angular-module-example \
            angular-standalone-example \
            react-example \
            vue-example
          do
            if [[ ! -f "_deploy/$directory/index.html" ]]; then
              echo "Missing _deploy/$directory/index.html" >&2
              exit 1
            fi
          done

      - name: Acquire deploy mutex
        uses: ben-z/gh-action-mutex@v1.0.0-alpha.10
        with:
          branch: gh-mutex-deploy

      - name: Deploy PR preview
        if: ${{ inputs.mode == 'preview' }}
        id: deploy-preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _deploy
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: false
          action: deploy

      - name: Normalize preview root URL
        if: ${{ inputs.mode == 'preview' }}
        id: preview-root
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.preview-url }}
        run: echo "url=${PREVIEW_URL%/}/" >> "$GITHUB_OUTPUT"

      - name: Check out gh-pages
        if: ${{ inputs.mode == 'production' }}
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: _gh-pages
          fetch-depth: 1

      - name: Replace production directories
        if: ${{ inputs.mode == 'production' }}
        working-directory: _gh-pages
        run: |
          for directory in \
            storybook \
            html-cdn-example \
            html-vite-example \
            angular-module-example \
            angular-standalone-example \
            react-example \
            vue-example
          do
            rm -rf "$directory"
            mkdir -p "$directory"
            cp -a "../_deploy/$directory/." "$directory/"
          done

      - name: Commit and push production deployment
        if: ${{ inputs.mode == 'production' }}
        working-directory: _gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            storybook \
            html-cdn-example \
            html-vite-example \
            angular-module-example \
            angular-standalone-example \
            react-example \
            vue-example

          if git diff --cached --quiet; then
            echo "No production deployment changes"
            exit 0
          fi

          git commit -m "Deploy production sites"
          git push origin HEAD:gh-pages

  cleanup:
    if: ${{ inputs.mode == 'cleanup' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Acquire deploy mutex
        uses: ben-z/gh-action-mutex@v1.0.0-alpha.10
        with:
          branch: gh-mutex-deploy

      - name: Remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          comment: false
          action: remove