name: Main Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - master

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: false

jobs:
  check-skip:
  # Job to check if the commit message contains 'ci skip' or 'skip ci'
  # Only works on push events not on pull_request events
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        run: |
          if [[ "${{ contains(github.event.head_commit.message, 'ci skip') || contains(github.event.head_commit.message, 'skip ci') }}" == "true" ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping CI"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Running CI"
          fi
    permissions:
      contents: read

  test:
    needs: [check-skip]
    if: ${{ needs.check-skip.outputs.skip == 'false' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Enable corepack and install pnpm
        run: |
          corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: google/wireit@setup-github-actions-caching/v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build components (required for wrapper tests)
        run: pnpm -F @infineon/infineon-design-system-stencil build

      - name: Run tests
        run: pnpm -r test
    permissions:
      contents: read

  build-publish-library:
    needs: [check-skip, test]
    if: ${{ needs.check-skip.outputs.skip == 'false' && github.event.action != 'closed' }}
    uses: ./.github/workflows/shared-build-publish-libraries.yml
    concurrency:
      group: ${{ github.workflow }}-build-publish-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    secrets: inherit
    permissions:
      contents: write
      pages: write
      actions: write
      issues: write
      pull-requests: write
      id-token: write


  build-storybook:
    needs: [check-skip, test, build-publish-library]
    if: ${{ needs.check-skip.outputs.skip == 'false' && github.event.action != 'closed' }}
    uses: ./.github/workflows/shared-build-storybook.yml
    with:
      package-version: ${{ needs.build-publish-library.outputs.published-version }}
      name: storybook
      required-packages: '@infineon/infineon-design-system-stencil'
    permissions:
      contents: write
      pages: write

  build-html-cdn-example:
    needs: [check-skip, test, build-publish-library]
    if: ${{ needs.check-skip.outputs.skip == 'false' && github.event.action != 'closed'}}
    uses: ./.github/workflows/shared-build-example.yml
    with:
      name: html-cdn-example
      base-path: examples/html-cdn-example
      deploy-path: dist
      package-version: ${{ needs.build-publish-library.outputs.published-version }}
      required-packages: '@infineon/infineon-design-system-stencil'
    permissions:
      contents: write
      pages: write

  build-html-vite-example:
    needs: [check-skip, test, build-publish-library]
    if: ${{ needs.check-skip.outputs.skip == 'false' && github.event.action != 'closed'}}
    uses: ./.github/workflows/shared-build-example.yml
    with:
      name: html-vite-example
      base-path: examples/html-vite-example
      deploy-path: dist
      package-version: ${{ needs.build-publish-library.outputs.published-version }}
      required-packages: '@infineon/infineon-design-system-stencil'
    permissions:
      contents: write
      pages: write

  build-angular-module-example:
    needs: [check-skip, test, build-publish-library]
    if: ${{ needs.check-skip.outputs.skip == 'false' && github.event.action != 'closed'}}
    uses: ./.github/workflows/shared-build-example.yml
    with:
      name: angular-module-example
      base-path: examples/angular-module-example
      deploy-path: dist/browser
      package-version: ${{ needs.build-publish-library.outputs.published-version }}
      required-packages: '@infineon/infineon-design-system-stencil,@infineon/infineon-design-system-angular'
    permissions:
      contents: write
      pages: write

  build-angular-standalone-example:
    needs: [check-skip, test, build-publish-library]
    if: ${{ needs.check-skip.outputs.skip == 'false' && github.event.action != 'closed'}}
    uses: ./.github/workflows/shared-build-example.yml
    with:
      name: angular-standalone-example
      base-path: examples/angular-standalone-example
      deploy-path: dist/browser
      package-version: ${{ needs.build-publish-library.outputs.published-version }}
      required-packages: '@infineon/infineon-design-system-stencil,@infineon/infineon-design-system-angular'
    permissions:
      contents: write
      pages: write

  build-react-example:
    needs: [check-skip, test, build-publish-library]
    if: ${{ needs.check-skip.outputs.skip == 'false' && github.event.action != 'closed'}}
    uses: ./.github/workflows/shared-build-example.yml
    with:
      name: react-example
      base-path: examples/react-example
      deploy-path: dist
      package-version: ${{ needs.build-publish-library.outputs.published-version }}
      required-packages: '@infineon/infineon-design-system-stencil,@infineon/infineon-design-system-react'
    permissions:
      contents: write
      pages: write

  build-vue-example:
    needs: [check-skip, test, build-publish-library]
    if: ${{ needs.check-skip.outputs.skip == 'false' && github.event.action != 'closed'}}
    uses: ./.github/workflows/shared-build-example.yml
    with:
      name: vue-example
      base-path: examples/vue-example
      deploy-path: dist
      package-version: ${{ needs.build-publish-library.outputs.published-version }}
      required-packages: '@infineon/infineon-design-system-stencil,@infineon/infineon-design-system-vue'
    permissions:
      contents: write
      pages: write

  deploy-pages:
    needs:
      - check-skip
      - build-storybook
      - build-html-cdn-example
      - build-html-vite-example
      - build-angular-module-example
      - build-angular-standalone-example
      - build-react-example
      - build-vue-example
    if: ${{ needs.check-skip.outputs.skip == 'false' && github.event.action != 'closed' }}
    uses: ./.github/workflows/shared-deploy-pages.yml
    with:
      mode: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    permissions:
      contents: write

  cleanup-pages:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    uses: ./.github/workflows/shared-deploy-pages.yml
    with:
      mode: cleanup
    permissions:
      contents: write

  comment-pr:
    needs:
      - check-skip
      - build-publish-library
      - deploy-pages
    if: ${{ always() && needs.check-skip.outputs.skip == 'false' && github.event_name == 'pull_request' && github.event.action != 'closed'}}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR with preview links
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          header: "PR Preview Links"
          message: |
            ### Storybook Preview
            ${{ needs.deploy-pages.result == 'success' && format('- [Storybook]({0}storybook/)', needs.deploy-pages.outputs.preview-url) || '- ❌ Complete preview deployment failed' }}

            ### Preview Links for Deployed Examples
            ${{ needs.deploy-pages.result == 'success' && format('- [HTML CDN Example]({0}html-cdn-example/)', needs.deploy-pages.outputs.preview-url) || '' }}
            ${{ needs.deploy-pages.result == 'success' && format('- [HTML Vite Example]({0}html-vite-example/)', needs.deploy-pages.outputs.preview-url) || '' }}
            ${{ needs.deploy-pages.result == 'success' && format('- [Angular Example (Module)]({0}angular-module-example/)', needs.deploy-pages.outputs.preview-url) || '' }}
            ${{ needs.deploy-pages.result == 'success' && format('- [Angular Example (Standalone)]({0}angular-standalone-example/)', needs.deploy-pages.outputs.preview-url) || '' }}
            ${{ needs.deploy-pages.result == 'success' && format('- [React Example]({0}react-example/)', needs.deploy-pages.outputs.preview-url) || '' }}
            ${{ needs.deploy-pages.result == 'success' && format('- [Vue Example]({0}vue-example/)', needs.deploy-pages.outputs.preview-url) || '' }}

            Version: ${{ needs.build-publish-library.outputs.published-version }}