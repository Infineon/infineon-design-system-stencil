name: Build Storybook

on:
  workflow_call:
    inputs:
      package-version:
        required: true
        type: string
        description: 'Package version to use'
      name:
        required: false
        type: string
        description: 'Name used for the artifact'
        default: 'storybook'
permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    env:
      PACKAGE_VERSION: ${{ inputs.package-version }}
    steps:
      - uses: actions/checkout@v5
        if: ${{ github.event.action != 'closed' }}
        with:
          fetch-depth: 1

      - name: Enable corepack and install pnpm
        if: ${{ github.event.action != 'closed' }}
        run: |
          corepack enable

      - name: Set up Node.js
        if: ${{ github.event.action != 'closed' }}
        uses: actions/setup-node@v6
        with:
          node-version: '24.11.1'
          cache: 'pnpm'

      - uses: google/wireit@setup-github-actions-caching/v2
        if: ${{ github.event.action != 'closed' }}

      - name: Install dependencies
        if: ${{ github.event.action != 'closed' }}
        run: pnpm install --filter='@infineon/design-system' --no-frozen-lockfile

      - name: Build Storybook
        if: ${{ github.event.action != 'closed' }}
        run: |
          pnpm --filter='@infineon/design-system' build-storybook

      - name: Upload build artifact
        if: ${{ github.event.action != 'closed' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ inputs.name }}
          path: packages/components/storybook-static
          retention-days: 1
          if-no-files-found: error
